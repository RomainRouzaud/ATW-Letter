name: Weekly Newsletter Draft

on:
  schedule:
    # Tous les vendredis à 14:00 UTC
    - cron: '0 14 * * 5'
  workflow_dispatch:

jobs:
  run-weekly-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Weekly Newsletter Draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py --mode weekly
          # Optionnel : Archiver ou nettoyer les données de la semaine
          # rm -f data/raw/*.json data/summaries/*.json

      - name: Commit and Push Results
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m "📝 [Auto] Weekly Newsletter - $(date +'%Y-%m-%d')" || exit 0
          git push
